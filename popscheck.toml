[analysis]
extensions = [".xlsx", ".xlsm", ".xltx", ".xltm"]
recursive = false
strict_sheet_order = true

# Les seuils privilégient l'absence de faux positifs. Ne les abaissez qu'après
# validation sur un échantillon représentatif de fichiers POPS.
min_axis_similarity = 0.62
move_min_similarity = 0.84
ambiguity_margin = 0.08

max_cells_per_sheet = 500000
max_rows = 50000
max_columns = 2000
max_style_gap = 25
detect_value_only_expansion = false
report_ambiguities = true

# Audits sémantiques. Les dépendances peuvent être activées même si la
# comparaison détaillée des formules est désactivée.
compare_formulas = true
compare_dependencies = true
compare_controlled_values = true
max_dependency_depth = 8
max_dependency_samples = 20
numeric_absolute_tolerance = 0.0
numeric_relative_tolerance = 0.0

